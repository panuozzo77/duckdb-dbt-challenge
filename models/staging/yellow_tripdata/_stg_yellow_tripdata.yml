version: 2

models:
  - name: stg_2_trip__cleaned
    tests:
      - dbt_utils.expression_is_true:
          expression: "DATEDIFF('minute', pickup, dropoff) BETWEEN 1 AND (24*60)"
      - dbt_utils.expression_is_true:
          expression: "start_location_id BETWEEN 1 AND 265" # passa di base
      - dbt_utils.expression_is_true:
          expression: "end_location_id BETWEEN 1 AND 265" # passa di base
      - dbt_utils.expression_is_true: 
          expression: "passenger_count > 0" # passa con pulizia
      - dbt_utils.expression_is_true:
          expression: "trip_distance >= 0" # passa con pulizia
      - dbt_utils.expression_is_true:
          expression: "total_amount >= 0" # passa con pulizia
    
    columns:
      - name: vendor_id
        tests:
          - accepted_values:
              values: [1, 2, 6, 7] # passa di base
      - name: rate_code_id
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 99] # passa di base
      - name: store_and_fwd_flag
        tests:
          - accepted_values:
              values: ['Y', 'N'] # passa di base
      - name: payment_type
        tests:
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6] #passa di base
