version: 2

models:
  - name: stg_trip__base
    description: "Rinomina e standardizza le colonne dalla fonte dati grezza. Genera anche una PK `trip_id` per ogni corsa."
    columns:
      - name: trip_id
        description: "{{ doc('trip_id') }}"
        tests:
          - unique
      - name: vendor_id
        description: "{{ doc('vendor_id') }}"
      - name: pickup
        description: "Timestamp per inizio della corsa."
      - name: dropoff
        description: "Timestamp per la fine della corsa."
      - name: rate_code_id
        description: "{{ doc('rate_code_id') }}"
      - name: store_and_fwd_flag
        description: "{{ doc('store_and_fwd_flag') }}"
      - name: start_location_id
        description: "ID della zona di partenza. {{ doc('location_id') }}"
      - name: end_location_id
        description: "ID della zona di arrivo. {{ doc('location_id') }}"
      - name: passenger_count
        description: "Numero di passeggeri."
      - name: trip_distance
        description: "Distanza in miglia."
      - name: fare_amount
        description: "Tariffa base della corsa, calcolata in base a tempo e distanza."
      - name: extra
        description: "Supplementi vari."
      - name: mta_tax
        description: "Tassa obbligatoria."
      - name: tip_amount
        description: "Eventuale mancia."
      - name: tolls_amount
        description: "Importo dei pedaggi autostradali."
      - name: improvement_surcharge
        description: "Supplemento per il miglioramento del servizio."
      - name: congestion_surcharge
        description: "Supplemento per traffico."
      - name: airport_fee
        description: "Tassa aeroportuale."
      - name: payment_type
        description: "{{ doc('payment_type') }}"
      - name: total_amount
        description: "{{ doc('total_amount') }}"

  - name: stg_trip__cleaned
    description: "Applica filtri e regole di pulizia al modello di base per rimuovere dati anomali o inconsistenti, come corse con durata non plausibile, distanza zero o importi negativi."
    tests:
      - dbt_utils.expression_is_true:
          expression: "DATEDIFF('minute', pickup, dropoff) BETWEEN 1 AND (3.5*60)" # passa con pulizia
      - dbt_utils.expression_is_true:
          expression: "start_location_id BETWEEN 1 AND 265" # passa di base
      - dbt_utils.expression_is_true:
          expression: "end_location_id BETWEEN 1 AND 265" # passa di base
      - dbt_utils.expression_is_true: 
          expression: "passenger_count > 0" # passa con pulizia
      - dbt_utils.expression_is_true:
          expression: "trip_distance >= 0" # passa con pulizia
      - dbt_utils.expression_is_true:
          expression: "total_amount >= 0" # passa con pulizia
      - dbt_utils.expression_is_true:
              expression: "total_amount >= fare_amount + extra + mta_tax + tip_amount + tolls_amount + improvement_surcharge + congestion_surcharge + airport_fee" # Got 477059 results (risolto con pulizia)
    
    columns:
      - name: vendor_id
        tests:
          - accepted_values:
              values: [1, 2, 6, 7] # passa di base
      - name: rate_code_id
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 99] # passa di base
      - name: store_and_fwd_flag
        tests:
          - accepted_values:
              values: ['Y', 'N'] # passa di base
      - name: payment_type
        tests:
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6] #passa di base

  - name: stg_trip__speed_filtered
    description: "Calcola la velocità media per ogni corsa e filtra quelle con velocità non realistiche (es. troppo lente o troppo veloci), eliminando potenziali errori di tracciamento."
    tests:
    - dbt_utils.expression_is_true:
        expression: "avg_speed_mph BETWEEN 3 AND 80" # passa con filtro velocità
    - dbt_utils.expression_is_true:
        expression: "trip_duration_hours BETWEEN 0.0166 AND 3.5" # tra 1 minuto e 3.5h