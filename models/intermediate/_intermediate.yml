version: 2

models:
  - name: int_trip__identifiers
    description: "Identificatori principali della corsa (PK generata, vendor e codici tariffari)."
    columns:
      - name: trip_id
        description: "{{ doc('trip_id') }}"
        tests:
          - unique
          - not_null
      - name: vendor_id
        description: "{{ doc('vendor_id') }}"
        tests:
          - not_null
      - name: rate_code_id
        description: "{{ doc('rate_code_id') }}"
      - name: store_and_fwd_flag
        description: "{{ doc('store_and_fwd_flag') }}"
        tests:
          - accepted_values:
              values: ['Y', 'N']

  - name: int_trip__metrics
    description: "Metriche quantitative della corsa: distanza, durata e velocità medie."
    tests:
      - dbt_utils.expression_is_true:
          expression: "avg_speed_mph BETWEEN 3 AND 80"
      - dbt_utils.expression_is_true:
          expression: "trip_minutes > 0"
      - dbt_utils.expression_is_true:
          expression: "trip_distance >= 0"
    columns:
      - name: trip_distance
        description: "Distanza in miglia."

      - name: trip_minutes
        description: "Durata della corsa in minuti (calcolata da trip_duration_hours)."

      - name: avg_speed_mph
        description: "Velocità media stimata in mph."
          

  - name: int_trip__prices
    description: "Composizione del prezzo della corsa (tariffe, tasse, mance, pedaggi, totale)."
    tests:
      - dbt_utils.expression_is_true:
          expression: "total_amount >= 0"
      - dbt_utils.expression_is_true:
          expression: "total_amount >= COALESCE(fare_amount,0) + COALESCE(extra,0) + COALESCE(mta_tax,0) + COALESCE(tip_amount,0) + COALESCE(tolls_amount,0) + COALESCE(improvement_surcharge,0) + COALESCE(congestion_surcharge,0) + COALESCE(airport_fee,0)"
    columns:
      - name: fare_amount
        description: "Tariffa base della corsa, calcolata in base a tempo e distanza."

      - name: extra
        description: "Supplementi vari."

      - name: mta_tax
        description: "Tassa obbligatoria."

      - name: tip_amount
        description: "Eventuale mancia."

      - name: tolls_amount
        description: "Importo dei pedaggi autostradali."

      - name: improvement_surcharge
        description: "Supplemento per il miglioramento del servizio."

      - name: congestion_surcharge
        description: "Supplemento per traffico."

      - name: airport_fee
        description: "Tassa aeroportuale."

      - name: total_amount
        description: "{{ doc('total_amount') }}"
        tests:
          - not_null
 

  - name: int_trip__temporal_spatial
    description: "Campi temporali e spaziali: pickup, dropoff, start/end location."
    tests:
      - dbt_utils.expression_is_true:
          expression: "start_location_id BETWEEN 1 AND 265"
      - dbt_utils.expression_is_true:
          expression: "end_location_id BETWEEN 1 AND 265"
    columns:
      - name: pickup
        description: "Timestamp di partenza."
        tests:
          - not_null

      - name: dropoff
        description: "Timestamp di arrivo."
        tests:
          - not_null

      - name: start_location_id
        description: "ID della zona di partenza. {{ doc('location_id') }}"

      - name: end_location_id
        description: "ID della zona di arrivo. {{ doc('location_id') }} (zona di arrivo)"

  - name: int_zone__pickup_summary
    description: "Riepilogo per zona di pickup: numero corse e ricavi aggregati."
    tests:
      - dbt_utils.expression_is_true:
          expression: "pickup_zone BETWEEN 1 AND 265"
      - dbt_utils.expression_is_true:
          expression: "num_trips >= 1"
      - dbt_utils.expression_is_true:
          expression: "total_revenue >= 0"
    columns:
      - name: pickup_zone
        description: "ID della zona di partenza. {{ doc('location_id') }}"
        tests:
          - not_null

      - name: num_trips
        description: "Conteggio delle corse partite dalla stessa zona."
        tests:
          - not_null

      - name: total_revenue
        description: "Totale ricavi per zona di partenza."
        tests:
          - not_null


